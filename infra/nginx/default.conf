# عنوان العميل الحقيقي: ترويسة Cloudflare إن وُجدت وإلا عنوان الاتصال المباشر (يُستخدم في تحديد المعدل وقائمة IP لمدير المنصة)
# The real client address: Cloudflare's header when present, else the direct peer (used for rate limiting and the platform IP allowlist)
map $http_cf_connecting_ip $client_ip {
  default $http_cf_connecting_ip;
  ''      $remote_addr;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 10m;
  include /etc/nginx/snippets/security-headers.conf;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # ملفات الواجهة المبنية بأسماء مجزّأة: تُخزَّن طويلاً. Built web assets have hashed names: cache them long.
  location /assets/ {
    root /usr/share/nginx/html;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/web-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # باقي المسارات تعود لصفحة التطبيق (راوتر في المتصفح) دون تخزين مؤقت لها. Everything else falls back to the app page (client-side router), never cached.
  location / {
    root /usr/share/nginx/html;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/web-headers.conf;
    add_header Cache-Control "no-store" always;
    try_files /index.html =404;
  }
}
