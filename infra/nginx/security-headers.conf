# تُضمَّن في الخادم وفي كل location يستعمل add_header (nginx يستبدل الموروث ولا يدمجه)
# Included in the server and in every location that uses add_header (nginx replaces inherited headers, it does not merge them)
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# الكاميرا للتطبيق نفسه فقط (مسح الباركود)؛ الباقي محجوب. Camera for the app itself only (barcode scan); the rest is blocked.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
