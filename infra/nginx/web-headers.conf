# سياسة المحتوى للواجهة: لا سكربتات خارجية ولا إطارات. style-src يسمح بالأنماط المضمّنة لأن Mantine يكتب style على العناصر.
# Content policy for the web app: no external scripts or frames. style-src allows inline styles because Mantine writes style attributes.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
