name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # typecheck + lint + prettier + unit + build
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # اختبارات التكامل على PostgreSQL حقيقي (العزل بين الشركات، التهجيرات).
  # Integration tests on a real PostgreSQL (tenant isolation, migrations).
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  # يتأكد أن الصورة تُبنى وتعمل على arm64 (خادم Oracle) مع قاعدة بيانات حقيقية وتهجيرات.
  # Ensures the image builds and runs on arm64 (the Oracle server) with a real database and migrations.
  docker:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f apps/api/Dockerfile -t inventory-api:ci .
      - name: Start Postgres
        run: |
          docker network create ci
          docker run -d --name pg --network ci \
            -e POSTGRES_PASSWORD=postgres \
            public.ecr.aws/docker/library/postgres:16
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U postgres && break
            sleep 1
          done
      - name: Smoke test (boot, migrate, /api/v1/health)
        run: |
          docker run -d --name api --network ci -p 3000:3000 \
            -e DATABASE_URL=postgres://postgres:postgres@pg:5432/postgres \
            inventory-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/v1/health; then echo; exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1
      - name: Migrations were applied
        run: docker exec pg psql -U postgres -tAc "SELECT name FROM schema_migrations"
      - name: Server refuses to start without DATABASE_URL
        run: |
          if docker run --rm inventory-api:ci; then
            echo "expected a startup failure without DATABASE_URL"; exit 1
          fi
