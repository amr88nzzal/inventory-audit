name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # typecheck + lint + prettier + unit + build
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # يتأكد أن الصورة تُبنى وتعمل على arm64 (خادم Oracle) لا على x64 فقط.
  # Ensures the image builds and runs on arm64 (the Oracle server), not just x64.
  docker:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f apps/api/Dockerfile -t inventory-api:ci .
      - name: Smoke test /api/v1/health
        run: |
          docker run -d --name api -p 3000:3000 inventory-api:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/api/v1/health; then echo; exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1
