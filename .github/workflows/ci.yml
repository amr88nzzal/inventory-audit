name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # typecheck + lint + prettier + unit + build
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # اختبارات التكامل على PostgreSQL حقيقي (العزل بين الشركات، التهجيرات).
  # Integration tests on a real PostgreSQL (tenant isolation, migrations).
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  # يتأكد أن الصورة تُبنى وتعمل على arm64 (خادم Oracle) مع قاعدة بيانات حقيقية وتهجيرات.
  # Ensures the image builds and runs on arm64 (the Oracle server) with a real database and migrations.
  docker:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f infra/Dockerfile.api -t inventory-api:ci .
      - name: Start Postgres
        run: |
          docker network create ci
          docker run -d --name pg --network ci \
            -e POSTGRES_PASSWORD=postgres \
            public.ecr.aws/docker/library/postgres:16
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U postgres && break
            sleep 1
          done
      - name: Smoke test (boot, migrate, /api/v1/health, default deny)
        run: |
          JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')
          ENCRYPTION_KEYS="k1:$(openssl rand -base64 32)"
          echo "JWT_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"
          echo "ENCRYPTION_KEYS=$ENCRYPTION_KEYS" >> "$GITHUB_ENV"
          docker run -d --name api --network ci -p 3000:3000 \
            -e DATABASE_URL=postgres://postgres:postgres@pg:5432/postgres \
            -e JWT_SECRET="$JWT_SECRET" \
            -e ENCRYPTION_KEYS="$ENCRYPTION_KEYS" -e ENCRYPTION_KEY_ID=k1 \
            -e PLATFORM_ADMIN_USERNAME=ci-owner -e PLATFORM_ADMIN_PASSWORD=ci-bootstrap-password-1 \
            inventory-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/v1/health; then echo; break; fi
            if [ "$i" = 30 ]; then docker logs api; exit 1; fi
            sleep 1
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/v1/auth/me)
          [ "$code" = 401 ] || { echo "expected 401 without a token, got $code"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/v1/platform/me)
          [ "$code" = 401 ] || { echo "expected 401 on the platform area without a token, got $code"; exit 1; }
      - name: Platform admin from the environment, and the CLI
        run: |
          # أول مدير منصة أُنشئ من البيئة عند الإقلاع: الدخول يطلب ربط TOTP، ولا يظهر السر في السجلات.
          # The first platform admin was created from the environment at boot: sign-in asks for TOTP enrollment, and the password never appears in logs.
          step=$(curl -fsS -X POST http://127.0.0.1:3000/api/v1/platform/auth/login \
            -H 'content-type: application/json' \
            -d '{"username":"ci-owner","password":"ci-bootstrap-password-1"}' | grep -o '"step":"enroll"')
          [ "$step" = '"step":"enroll"' ] || { echo "expected the enroll step"; exit 1; }
          if docker logs api 2>&1 | grep -q 'ci-bootstrap-password-1'; then echo "password leaked into logs"; exit 1; fi
          # أمر CLI داخل الحاوية نفسها (الخيار الأول). The CLI inside the same image (the first option).
          docker exec -e PLATFORM_CLI_PASSWORD=ci-cli-password-1234 api node dist/cli.js create-platform-admin ci-second
          if docker exec -e PLATFORM_CLI_PASSWORD=ci-cli-password-1234 api node dist/cli.js create-platform-admin ci-second; then
            echo "expected a duplicate-username failure"; exit 1
          fi
      - name: Migrations were applied
        run: docker exec pg psql -U postgres -tAc "SELECT name FROM schema_migrations"
      - name: Server refuses to start with missing or weak configuration
        run: |
          if docker run --rm inventory-api:ci; then
            echo "expected a startup failure without DATABASE_URL and JWT_SECRET"; exit 1
          fi
          if docker run --rm --network ci \
            -e DATABASE_URL=postgres://postgres:postgres@pg:5432/postgres \
            -e ENCRYPTION_KEYS="$ENCRYPTION_KEYS" -e ENCRYPTION_KEY_ID=k1 \
            -e JWT_SECRET=super-secret-jwt-key-change-this-in-production \
            inventory-api:ci; then
            echo "expected a startup failure with a placeholder JWT_SECRET"; exit 1
          fi
      - name: Production compose stack (migrate, least-privilege login, gateway, backup)
        run: |
          # نشغّل ملف الإنتاج نفسه كما على الخادم: migrate ثم api خلف gateway، وحساب دخول بلا صلاحيات.
          # Run the very production compose file as on the server: migrate, then api behind the gateway, with a privilege-less login.
          docker rm -f api pg >/dev/null 2>&1 || true
          cat > "$RUNNER_TEMP/stack.env" <<ENV
          POSTGRES_USER=inventory
          POSTGRES_PASSWORD=$(openssl rand -hex 24)
          POSTGRES_DB=inventory
          APP_DB_PASSWORD=$(openssl rand -hex 24)
          JWT_SECRET=$JWT_SECRET
          ENCRYPTION_KEYS=$ENCRYPTION_KEYS
          ENCRYPTION_KEY_ID=k1
          GATEWAY_PORT=18080
          BACKUP_PASSPHRASE_FILE=$RUNNER_TEMP/backup.passphrase
          ENV
          openssl rand -base64 32 > "$RUNNER_TEMP/backup.passphrase"
          mkdir -p "$RUNNER_TEMP/rclone"; echo "RCLONE_CONFIG_DIR=$RUNNER_TEMP/rclone" >> "$RUNNER_TEMP/stack.env"
          C="docker compose -f infra/docker-compose.yml --env-file $RUNNER_TEMP/stack.env"
          echo "C=$C" >> "$GITHUB_ENV"
          $C --profile backup up -d --build
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/api/v1/health; then echo; break; fi
            if [ "$i" = 60 ]; then $C logs; exit 1; fi
            sleep 2
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/v1/roles)
          [ "$code" = 401 ] || { echo "expected 401 through the gateway, got $code"; exit 1; }
          # الواجهة: الجذر ومسار داخلي يعيدان صفحة التطبيق، والأصول مخزّنة طويلاً، و/api لا يسقط إلى الصفحة.
          # The web app: the root and a client route return the app page, assets cache long, and /api never falls back to the page.
          for p in / /login /tasks/123; do
            curl -fsS http://127.0.0.1:18080$p | grep -q '<div id="root">' || { echo "expected the app page at $p"; exit 1; }
          done
          asset=$(curl -fsS http://127.0.0.1:18080/ | grep -o '/assets/[^"]*\.js' | head -1)
          [ -n "$asset" ] || { echo "no script asset in the page"; exit 1; }
          curl -sI http://127.0.0.1:18080$asset | grep -qi 'cache-control: public, max-age=31536000, immutable' || { echo "asset cache header missing"; exit 1; }
          curl -sI http://127.0.0.1:18080/ | grep -qi 'content-security-policy: default-src' || { echo "CSP missing on the app page"; exit 1; }
          if curl -s http://127.0.0.1:18080/api/v1/nope | grep -q '<div id="root">'; then
            echo "an unknown /api route must not fall back to the app page"; exit 1
          fi
          curl -sI http://127.0.0.1:18080/api/v1/health | grep -qi 'x-content-type-options: nosniff' || { echo "security headers missing"; exit 1; }
      - name: Stack works as the privilege-less login (demo seed, sign-in, no raw access)
        run: |
          $C exec -T api node dist/cli.js seed-demo
          token=$(curl -fsS -X POST http://127.0.0.1:18080/api/v1/auth/login \
            -H 'content-type: application/json' \
            -d '{"companyCode":"demo","username":"demo.admin","password":"Demo-Inventory-2026"}' | grep -o '"accessToken":"[^"]*"' | cut -d'"' -f4)
          [ -n "$token" ] || { echo "demo sign-in failed"; $C logs api; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" http://127.0.0.1:18080/api/v1/roles)
          [ "$code" = 200 ] || { echo "expected 200 for the demo admin, got $code"; exit 1; }
          # الحساب بلا صلاحيات بذاته: أي استعلام مباشر يفشل. The login holds nothing itself: a raw query must fail.
          out=$($C exec -T -e PGPASSWORD="$(grep ^APP_DB_PASSWORD "$RUNNER_TEMP/stack.env" | cut -d= -f2)" postgres psql -h localhost -U inventory_login -d inventory -tAc "select count(*) from users" 2>&1 || true)
          echo "$out" | grep -q 'permission denied' || { echo "expected permission denied for a raw query, got: $out"; exit 1; }
          # إعادة تشغيل migrate آمنة (idempotent). Re-running migrate is safe.
          $C run --rm migrate
      - name: Encrypted backup and restore verification
        run: |
          $C exec -T backup /opt/backup/backup.sh
          $C exec -T backup /opt/backup/restore-verify.sh
          $C down -v
